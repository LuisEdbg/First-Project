<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bibliotheca</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&display=swap">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
  <div class="sidebar">
    <ol class="brand">
        <li class="logo-mark">B</li>
        <li id="titulo-pag">Bibliotheca</li>
    </ol>

    <ul class="navegation-list">

        <li class="home">
          <a href="#">
            <i class="ph ph-squares-four"></i>
              <span>Home</span>
          </a>
        </li>

        <li class="home">
          <a href="#">
            <i class="ph ph-compass"></i>
              <span>Browse</span>
          </a>
        </li>

        <li class="home">
          <a href="#">
            <i class="ph ph-book-open"></i>
              <span>My Books</span>
          </a>
        </li>

        <li class="home">
          <a href="#">
            <i class="ph ph-bookmark-simple"></i>
              <span>Wishlist</span>
          </a>
        </li>

        <li class="home">
          <a href="#">
            <i class="ph ph-list-bullets"></i>
              <span>Reading Lists</span>
          </a>
        </li>

        <li class="home">
          <a href="#">
            <i class="ph ph-gear"></i>
              <span>Settings</span>
          </a>
        </li>
    </ul>

    <section class="reading-lists-section">
      <h2 class="sidebar-heading">MY SHELVES</h2>
        <ul class="lists-stack">
          <li id="shelf-0">
            <a href="#">
              <i class="ph ph-bookmark-simple"></i>
                <span>Winter Reads 2026</span>
            </a>
          </li>

          <li id="shelf-0">
            <a href="#">
              <i class="ph ph-bookmark-simple"></i>
                <span>Design & Typography</span>
            </a>
          </li>

          <li id="shelf-0">
            <a href="#">
              <i class="ph ph-bookmark-simple"></i>
                <span>Classic Philosophy</span>
            </a>
          </li>
        </ul>
    </section>

    <footer class="sidebar-footer">
      <aside class="user-profile">
         <img id="user-avatar" src="https://media.istockphoto.com/id/1337144146/pt/vetorial/default-avatar-profile-icon-vector.jpg?s=612x612&w=0&k=20&c=_XeYoSJQIN7GrE08cUQDJCo3U7yvoEp5OKpbhQzpmC0=" alt="">
          <ol class="profile-meta">
            <li id="name-user">Luis Eduardo</li>
            <li id="carge-user">Librarian Host</li>
          </ol>
      </aside>
              <i class="ph ph-caret-down" id="profile-arrow"></i>
    </footer>
  </div>
</body>
</html>
